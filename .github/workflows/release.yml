name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Require DSH compatibility declaration
        run: |
          node -e "const p=require('./package.json');const v=p.dsh&&p.dsh.engines&&p.dsh.engines.dsh;if(!v){console.error('package.json 必须声明 dsh.engines.dsh（支持的 DSH 版本）');process.exit(1)}console.log('supports DSH',v)"

      - name: npm publish
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skip notice
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret 未配置，跳过 npm publish（GitHub Release 已创建）"
